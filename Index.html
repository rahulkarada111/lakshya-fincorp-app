
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#102b52">
<title>Lakshya Fincorp</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f2f5fa;color:#172b4d}
header{background:#102b52;color:white;padding:25px 20px;text-align:center}
.logo{font-size:28px;font-weight:bold;letter-spacing:1px}
header p{margin:8px 0 0;color:#d8e5fa}
main{max-width:420px;margin:35px auto;padding:20px}
.card{background:white;padding:25px;border-radius:16px;box-shadow:0 5px 20px #102b5218}
h2{text-align:center;margin-top:0}
label{display:block;margin:18px 0 7px;font-weight:bold}
input,select{width:100%;padding:13px;border:1px solid #ccd5e2;border-radius:8px;font-size:16px}
button{width:100%;padding:14px;background:#1769c2;color:white;border:0;border-radius:8px;font-size:16px;font-weight:bold;margin-top:22px}
footer{text-align:center;color:#78869b;font-size:12px;margin-top:25px}
</style>
</head>
<body>
<header>
<div class="logo">LAKSHYA FINCORP</div>
<p>Private Limited | Loan Management System</p>
</header>
<main>
<div class="card">
<h2>Welcome Back</h2>
<p style="text-align:center;color:#718096">Please Login to Continue</p>
<form onsubmit="event.preventDefault();alert('Login system will be connected in the next development step.');">
<label>User ID</label>
<input type="text" placeholder="Enter User ID" required>
<label>Password</label>
<input type="password" placeholder="Enter Password" required>
<label>Select Role</label>
<select required>
<option value="">Select your role</option>
<option>Admin</option>
<option>Staff / RO</option>
<option>Manager</option>
<option>Accounts Team</option>
</select>
<button type="submit">LOGIN</button>
</form>
</div>
<footer>© Lakshya Fincorp Pvt. Ltd.</footer>
</main>
</body>
</html>
